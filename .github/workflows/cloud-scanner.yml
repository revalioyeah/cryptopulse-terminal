name: CryptoPulse 24/7 Cloud Auto-Scanner (30m)

on:
  schedule:
    # Berjalan otomatis setiap 30 menit, 24 jam sehari, 7 hari seminggu
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Mode scan (BOTH = Futures Pro 6-Layer + Spot 100-Coin Funnel sekaligus)'
        type: choice
        required: false
        default: 'BOTH'
        options:
          - 'BOTH'
          - 'FUTURES'
          - 'SPOT_DCA'
      force_summary:
        description: 'Kirim ringkasan test ke Telegram meski belum ada sinyal baru lolos filter'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: 'cryptopulse-cloud-scanner'
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Futures Pro 6-Layer + Spot 100-Coin Funnel & Price Alert Cloud Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYNC_GIST_TOKEN: ${{ secrets.SYNC_GIST_TOKEN }}
          SYNC_GIST_ID: ${{ secrets.SYNC_GIST_ID }}
          SCAN_MODE: ${{ inputs.scan_mode || 'BOTH' }}
          FORCE_SUMMARY: ${{ inputs.force_summary || 'false' }}
        run: npm run scanner:cloud
